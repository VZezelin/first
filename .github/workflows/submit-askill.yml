name: Submit Signal Lab skill to askill

on:
  push:
    paths:
      - '.github/workflows/submit-askill.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit public repo for askill indexing once
        shell: bash
        run: |
          set -euo pipefail
          npx --yes askill-cli@latest submit https://github.com/VZezelin/first
