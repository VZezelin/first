name: Verify Signal Lab Agent Skill install

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-skills-install.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISABLE_TELEMETRY: '1'
    steps:
      - name: List Signal Lab skills from public GitHub
        run: |
          set -euo pipefail
          npx -y skills@latest add VZezelin/first --list
      - name: Install only Signal Lab skill for Codex in temp workspace
        run: |
          set -euo pipefail
          mkdir -p /tmp/signal-lab-skill-test
          cd /tmp/signal-lab-skill-test
          npx -y skills@latest add VZezelin/first --skill signal-lab-apify-tools -a codex -y --copy
          test -f .agents/skills/signal-lab-apify-tools/SKILL.md || test -f .codex/skills/signal-lab-apify-tools/SKILL.md
          grep -Fq 'name: signal-lab-apify-tools' .agents/skills/signal-lab-apify-tools/SKILL.md 2>/dev/null || grep -Fq 'name: signal-lab-apify-tools' .codex/skills/signal-lab-apify-tools/SKILL.md
          echo 'SKILLS_SH_CODEX_INSTALL_VERIFIED=true'
