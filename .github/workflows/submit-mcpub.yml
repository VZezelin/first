name: Verify Signal Lab in mcpub

on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * *'
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/submit-mcpub.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify production MCP discovery metadata
        run: |
          set -euo pipefail
          url='https://first-livid-omega.vercel.app/.well-known/mcp.json'
          body="$(curl -fsSL "$url")"
          printf '%s' "$body" | grep -Fq 'Signal Lab Apify Data Tools'
          printf '%s' "$body" | grep -Fq 'https://mcp.apify.com?tools='
          echo 'MCP_DISCOVERY_LIVE=true'

      - name: Verify archived mcpub listing by exact URL
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get","arguments":{"url":"https://first-livid-omega.vercel.app"}}}'
          response="$(curl -fsSL -X POST 'https://mcpub.dev/mcp' -H 'Content-Type: application/json' --data-binary "$payload")"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -Fq 'https://first-livid-omega.vercel.app'
          printf '%s' "$response" | grep -Fq 'Signal Lab remote MCP bundle'
          if printf '%s' "$response" | grep -Fq 'not_found'; then
            echo 'MCPUB_ARCHIVE_LISTED_VERIFIED=false' >&2
            exit 1
          fi
          echo 'MCPUB_ARCHIVE_LISTED_VERIFIED=true'

      - name: Check mcpub live verified cache
        run: |
          set -euo pipefail
          payload='{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"search_live","arguments":{"query":"Signal Lab remote MCP bundle","limit":10,"offset":0}}}'
          response="$(curl -fsSL -X POST 'https://mcpub.dev/mcp' -H 'Content-Type: application/json' --data-binary "$payload")"
          printf '%s\n' "$response"
          if printf '%s' "$response" | grep -Fq 'https://first-livid-omega.vercel.app'; then
            echo 'MCPUB_LIVE_LISTED_VERIFIED=true'
          else
            echo 'MCPUB_LIVE_LISTED_VERIFIED=false'
          fi

      - name: Probe actual Apify MCP initialize without credentials
        continue-on-error: true
        run: |
          set -euo pipefail
          endpoint='https://mcp.apify.com?tools=signal_lab/amazon-price-tracker,signal_lab/google-autocomplete-keywords,signal_lab/website-to-markdown-crawler,signal_lab/youtube-transcript-scraper,signal_lab/reddit-search-comments,signal_lab/job-vacancy-scraper,signal_lab/restaurant-menu-extractor'
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"signal-lab-verifier","version":"1.0"}}}'
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -D "$headers_file" -w '%{http_code}' -X POST "$endpoint" -H 'Content-Type: application/json' --data-binary "$body")"
          echo "APIFY_MCP_INITIALIZE_HTTP=$status"
          grep -iE '^(www-authenticate|mcp-session-id|content-type):' "$headers_file" || true
          cat "$response_file"
          echo
