name: Submit Signal Lab to AgentSkillsHub

on:
  push:
    paths:
      - '.github/workflows/submit-agentskillshub.yml'

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit once through the public production form contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, html, json, re, urllib.parse, urllib.request, urllib.error

          SITE='https://agentskillshub.top'
          FULL='VZezelin/first'
          UA='Mozilla/5.0 Signal-Lab-Directory-Submission/1.0'

          def get(url):
              req=urllib.request.Request(url, headers={'User-Agent':UA})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode('utf-8','replace')

          page=get(SITE + '/')
          scripts=[urllib.parse.urljoin(SITE, html.unescape(x)) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)', page)]
          supabase_url=None
          anon_key=None
          for src in scripts:
              try:
                  txt=get(src)
              except Exception:
                  continue
              if not supabase_url:
                  m=re.search(r'https://[a-z0-9-]+\.supabase\.co', txt)
                  if m: supabase_url=m.group(0)
              if not anon_key:
                  m=re.search(r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}', txt)
                  if not m:
                      m=re.search(r'sb_publishable_[A-Za-z0-9_-]{20,}', txt)
                  if m: anon_key=m.group(0)
              if supabase_url and anon_key:
                  break
          if not (supabase_url and anon_key):
              raise SystemExit('Public Supabase production configuration not found in frontend bundle')

          headers={'apikey':anon_key, 'User-Agent':UA, 'Accept':'application/json'}
          if anon_key.startswith('eyJ'):
              headers['Authorization']='Bearer ' + anon_key

          def rest(method, path, body=None, prefer=None):
              h=dict(headers)
              data=None
              if body is not None:
                  h['Content-Type']='application/json'
                  data=json.dumps(body).encode()
              if prefer:
                  h['Prefer']=prefer
              req=urllib.request.Request(supabase_url + path, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8','replace')

          q=urllib.parse.quote(FULL, safe='')
          code, text=rest('GET', f'/rest/v1/skills?select=id&repo_full_name=eq.{q}&limit=1')
          if code < 200 or code >= 300:
              raise SystemExit(f'Public skills dedup query failed HTTP {code}')
          existing=json.loads(text or '[]')
          if existing:
              result={'status':'already_tracked','message':'VZezelin/first is already tracked by AgentSkillsHub','skill_id':existing[0].get('id')}
          else:
              # Try the same optional dedup query as the production frontend. RLS may block it; uniqueness still protects inserts.
              ecode, etext=rest('GET', f'/rest/v1/extra_repos?select=id,status&full_name=eq.{q}&limit=1')
              prior=[]
              if 200 <= ecode < 300:
                  try: prior=json.loads(etext or '[]')
                  except Exception: prior=[]
              if prior:
                  result={'status':'already_submitted','message':f"VZezelin/first is already submitted (status: {prior[0].get('status') or 'pending'})"}
              else:
                  icode, itext=rest('POST','/rest/v1/extra_repos',{
                      'full_name':FULL,
                      'is_active':False,
                      'status':'pending',
                      'submitted_by':'community'
                  },'return=representation')
                  if 200 <= icode < 300:
                      result={'status':'submitted','message':'Submitted successfully; AgentSkillsHub review is pending.'}
                  elif icode == 409 and ('23505' in itext or 'duplicate' in itext.lower()):
                      result={'status':'already_submitted','message':'VZezelin/first was already submitted.'}
                  else:
                      raise SystemExit(f'AgentSkillsHub production insert failed HTTP {icode}: {itext[:300]}')

          result['receivedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          with open('distribution/agentskillshub-receipt.json','w') as f:
              json.dump(result,f,indent=2)
          print(json.dumps({'status':result['status'],'message':result['message']}))
          PY
      - name: Commit sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add distribution/agentskillshub-receipt.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record AgentSkillsHub submission receipt'
          git push
