name: Submit Signal Lab skill to OpenAgentSkill

on:
  push:
    paths:
      - '.github/workflows/submit-openagentskill.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit public Agent Skill once
        shell: bash
        run: |
          set -euo pipefail
          payload='{"repository":"https://github.com/VZezelin/first","skillPath":"skills/signal-lab-apify-tools/SKILL.md","sourceRef":"main","category":"Web Scraping & Data","tags":["apify","web-scraping","mcp","data-api","agent-tools"]}'
          http_code=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST 'https://www.openagentskill.com/api/skills/submit' \
            -H 'Content-Type: application/json' \
            --data "$payload")
          echo "HTTP_STATUS=$http_code"
          cat /tmp/response.json
          echo
          test "$http_code" -ge 200 -a "$http_code" -lt 300
