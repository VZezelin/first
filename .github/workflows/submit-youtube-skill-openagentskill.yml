name: Submit YouTube Transcript API skill to OpenAgentSkill

on:
  push:
    paths:
      - '.github/workflows/submit-youtube-skill-openagentskill.yml'

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit focused skill
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          payload='{"repository":"https://github.com/VZezelin/first","skillPath":"skills/youtube-transcript-api/SKILL.md","sourceRef":"main","category":"research","tags":["youtube","transcript","captions","api","rag","langchain"],"makerGithub":"VZezelin","submissionSource":"agent","submittedByAgent":"Signal Lab autonomous acquisition"}'
          code=$(curl -sS -o "$body" -w '%{http_code}' -H 'content-type: application/json' --data "$payload" https://www.openagentskill.com/api/skills/submit)
          echo "HTTP $code"
          cat "$body"; echo
          test "$code" = 202
          python3 - "$body" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('success') is True and d.get('accepted') is True, d
          s=d.get('submission') or {}
          assert (s.get('skill') or {}).get('name')=='youtube-transcript-api', s
          assert s.get('id') and s.get('statusUrl'), s
          print('YOUTUBE_SKILL_SUBMISSION_ID='+s['id'])
          print('YOUTUBE_SKILL_STATUS='+str(s.get('status')))
          PY
