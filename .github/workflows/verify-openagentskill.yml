name: Verify Signal Lab skill in OpenAgentSkill

on:
  push:
    paths:
      - '.github/workflows/verify-openagentskill.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Query public OpenAgentSkill registry
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          code=$(curl -sS -G -o "$body" -w '%{http_code}' \
            --data-urlencode 'q=signal-lab-apify-tools' \
            --data-urlencode 'limit=5' \
            https://www.openagentskill.com/api/skills/search)
          echo "HTTP $code"
          cat "$body"
          echo
          test "$code" = "200"
          python3 - "$body" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          skills=d.get('skills') or []
          exact=[s for s in skills if s.get('slug')=='signal-lab-apify-tools' or s.get('name')=='signal-lab-apify-tools']
          print('OPENAGENTSKILL_PUBLIC_TOTAL='+str(d.get('total')))
          print('OPENAGENTSKILL_EXACT_LISTED='+('true' if exact else 'false'))
          if exact:
              x=exact[0]
              print('OPENAGENTSKILL_RANK='+str(x.get('rank')))
              print('OPENAGENTSKILL_MATCH='+str(x.get('match_type')))
              print('OPENAGENTSKILL_TRUST='+str((x.get('trust') or {}).get('score')))
          PY
