name: Update YouTube askill discovery metadata

on:
  push:
    paths:
      - '.github/workflows/update-youtube-askill-discovery.yml'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Publish 1.0.1 and verify public search position
        shell: bash
        run: |
          set -euo pipefail
          npx --yes askill-cli publish --github https://github.com/VZezelin/first/blob/main/skills/youtube-transcript-api/SKILL.md
          npx --yes askill-cli info @VZezelin/youtube-transcript-api --json > /tmp/info.json
          npx --yes askill-cli find youtube transcript --limit 100 --json > /tmp/find.json
          python3 - <<'PY'
          import json
          info=json.load(open('/tmp/info.json'))
          s=info['skill']
          assert s.get('version')=='1.0.1', s
          print('ASKILL_VERSION='+s['version'])
          print('ASKILL_TAGS='+','.join(s.get('tags') or []))
          data=json.load(open('/tmp/find.json'))
          skills=data.get('skills') or []
          positions=[i+1 for i,x in enumerate(skills) if x.get('owner')=='VZezelin' and x.get('name')=='youtube-transcript-api']
          print('ASKILL_BUYER_QUERY_FOUND='+('true' if positions else 'false'))
          if positions:
              print('ASKILL_BUYER_QUERY_POSITION='+str(positions[0]))
              x=skills[positions[0]-1]
              print('ASKILL_AI_SCORE='+str(x.get('aiScore')))
          PY
