name: Publish corrected YouTube skill to askill

on:
  push:
    paths:
      - '.github/workflows/publish-youtube-skill-askill-v2.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from GitHub SKILL.md
        shell: bash
        run: |
          set -euo pipefail
          npx --yes askill-cli publish --github https://github.com/VZezelin/first/blob/main/skills/youtube-transcript-api/SKILL.md
