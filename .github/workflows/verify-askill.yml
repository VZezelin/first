name: Verify Signal Lab skill in askill

on:
  push:
    paths:
      - '.github/workflows/verify-askill.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact skill is searchable in askill registry
        shell: bash
        run: |
          set -euo pipefail
          npx --yes askill-cli@latest find signal-lab-apify-tools --json | tee /tmp/find.json
          grep -q 'signal-lab-apify-tools' /tmp/find.json
          grep -q 'VZezelin/first' /tmp/find.json
