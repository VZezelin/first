name: Verify Signal Lab MCP in MCP Central

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-mcpcentral.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check MCP Central public catalog
        run: |
          set -euo pipefail
          id='io.github.VZezelin/signal-lab-apify-tools'
          encoded='io.github.VZezelin%2Fsignal-lab-apify-tools'
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "https://mcpcentral.io/api/servers/${encoded}")"
          echo "MCP_CENTRAL_HTTP=$status"
          cat "$response_file"
          echo
          if [ "$status" = "200" ] && grep -Fq "$id" "$response_file"; then
            echo "MCP_CENTRAL_LISTED_VERIFIED=true"
          else
            echo "MCP_CENTRAL_LISTED_VERIFIED=false"
            echo "Official Registry is already canonical; MCP Central mirror is still pending or uses a different public lookup shape."
          fi
